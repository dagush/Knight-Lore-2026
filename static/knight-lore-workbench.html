        <script>
            let semanticValidationOverlay = null;
            let semanticValidationCtx = null;
            let showPlayerValidation = false;
            let showSelectedCandidateValidation = true;
            let selectedCandidateIndexes = new Set();
            let candidateRowCount = -1;
            let latestSemanticFrame = null;
            let semanticFrameCounter = 0;
            const HEAD_MARKER_Y_OFFSET = -6;
            const HORIZONTAL_PLANE_SCALE = 2;
            const HIGH_RES_ORIGIN = 72;
            const HIGH_RES_SCREEN_Z = 128;
            const KNIGHT_LORE_POKE_ADDRESS_BASE = 0x0000;
            const KNIGHT_LORE_INVENTORY_SLOT_1_ADDRESS = 23516;
            const KNIGHT_LORE_POKE_PRESETS = {
                easyMode: [
                    {address: 24731, value: 209, label: 'easy mode 1'},
                    {address: 24732, value: 238, label: 'easy mode 2'},
                    {address: 24733, value: 63, label: 'easy mode 3'},
                ],
                infiniteLives: [
                    {address: 53567, value: 201, label: 'infinite lives'},
                ],
                infiniteTime: [
                    {address: 50084, value: 201, label: 'infinite time'},
                ],
                immunity: [
                    {address: 47196, value: 201, label: 'immunity'},
                ],
            };
            const KNIGHT_LORE_ACTIVE_POKES = [
                // Decimal absolute addresses from the newer poke list.
                ...KNIGHT_LORE_POKE_PRESETS.immunity,
                ...KNIGHT_LORE_POKE_PRESETS.infiniteLives,
            ];

            function hex(value, digits) {
                return value.toString(16).toUpperCase().padStart(digits, '0');
            }

            function parsePokeByteInput(rawValue) {
                const raw = String(rawValue || '').trim();
                if (raw === '') return null;

                let normalized = raw;
                let radix = 10;
                if (/^0x[0-9a-f]+$/i.test(normalized)) {
                    normalized = normalized.slice(2);
                    radix = 16;
                } else if (/^&[0-9a-f]+$/i.test(normalized) || /^\$[0-9a-f]+$/i.test(normalized)) {
                    normalized = normalized.slice(1);
                    radix = 16;
                } else if (/^[0-9a-f]+h$/i.test(normalized)) {
                    normalized = normalized.slice(0, -1);
                    radix = 16;
                } else if (/^[0-9a-f]*[a-f][0-9a-f]*$/i.test(normalized)) {
                    radix = 16;
                } else if (!/^[0-9]+$/.test(normalized)) {
                    return null;
                }

                const value = Number.parseInt(normalized, radix);
                if (!Number.isInteger(value) || value < 0 || value > 0xff) return null;
                return value;
            }

            function formatPokeByte(value) {
                return '0x' + hex(value, 2) + ' (' + value + ')';
            }

            function setInventoryPokeStatus(message, state) {
                const status = document.getElementById('inventory-poke-status');
                if (!status) return;
                status.textContent = message;
                status.className = state ? 'is-' + state : '';
            }

            function bindInventoryPokeControl() {
                const form = document.getElementById('inventory-poke-panel');
                const input = document.getElementById('inventory-item-code');
                const button = document.getElementById('send-inventory-item-code');
                if (!form || !input || !button) return;

                form.addEventListener('submit', event => {
                    event.preventDefault();
                    const value = parsePokeByteInput(input.value);
                    if (value === null) {
                        setInventoryPokeStatus('Enter a byte value: decimal, 0xNN, &NN, $NN, or NNh.', 'error');
                        input.focus();
                        return;
                    }
                    if (!emu || typeof emu.applyPokes !== 'function') {
                        setInventoryPokeStatus('Emulator is not ready yet.', 'error');
                        return;
                    }

                    button.disabled = true;
                    setInventoryPokeStatus('Sending ' + formatPokeByte(value) + '...', '');
                    emu.applyPokes([{
                        address: KNIGHT_LORE_INVENTORY_SLOT_1_ADDRESS,
                        value,
                        label: 'inventory slot 1 item code',
                    }]).then(payload => {
                        const result = payload && payload.results ? payload.results[0] : null;
                        if (!result || !result.applied) {
                            setInventoryPokeStatus('Poke failed.', 'error');
                            return;
                        }
                        const address = '0x' + hex(result.address, 4);
                        const before = result.before === undefined ? '--' : formatPokeByte(result.before);
                        const after = result.after === undefined ? '--' : formatPokeByte(result.after);
                        const state = result.readbackMatches ? 'ok' : 'error';
                        const note = result.readbackMatches ? 'Applied' : 'Readback mismatch';
                        setInventoryPokeStatus(note + ' at ' + address + ': ' + before + ' -> ' + after, state);
                    }).catch(error => {
                        setInventoryPokeStatus('Poke failed: ' + error.message, 'error');
                    }).finally(() => {
                        button.disabled = false;
                    });
                });
            }

            function readSemanticByte(frame, address) {
                const offset = address - frame.memoryStart;
                if (offset < 0 || offset >= frame.semanticMemory.length) return null;
                return frame.semanticMemory[offset];
            }

            function readSemanticBytes(frame, startAddress, length) {
                const bytes = [];
                for (let i = 0; i < length; i++) {
                    bytes.push(readSemanticByte(frame, startAddress + i));
                }
                return bytes;
            }

            function formatByte(value) {
                return value === null ? '--' : '0x' + hex(value, 2);
            }

            function formatPosition(position) {
                if (!position) return '(--, --, --)';
                return '(' + position.x + ', ' + position.y + ', ' + position.z + ')';
            }

            function toHighResolutionPosition(position, subcell) {
                if (
                    !position
                    || position.x === null
                    || position.y === null
                    || position.z === null
                ) {
                    return null;
                }

                subcell = subcell || {};
                return {
                    x: position.x * 16 + (subcell.x || 0) * 8 + HIGH_RES_ORIGIN,
                    y: position.y * 16 + (subcell.y || 0) * 8 + HIGH_RES_ORIGIN,
                    z: position.z * 12 + (subcell.z || 0) * 4 + HIGH_RES_SCREEN_Z,
                };
            }

            function fallbackKnightLoreScene(frame) {
                const selectedByteSpecs = [
                    ['player.body.x', 0x5c09],
                    ['player.body.y', 0x5c0a],
                    ['player.body.z', 0x5c0b],
                    ['player.body.mirrorFlag', 0x5c0f],
                    ['room.size.x', 0x5bab],
                    ['room.size.y', 0x5bac],
                    ['room.colourAttribute', 0x5bad],
                    ['room.size.z', 0x5bae],
                    ['room.id', 0x5c10],
                    ['player.head.x', 0x5c20],
                    ['player.head.y', 0x5c2a],
                    ['player.head.z', 0x5c2b],
                    ['player.head.mirrorFlag', 0x5c2f],
                    ['player.head.sprite', 0x5c41],
                    ['player.body.sprite', 0x5c45],
                    ['room.dynamicStart', 0x5c88],
                ];
                const read = address => readSemanticByte(frame, address);
                const body = {x: read(0x5c09), y: read(0x5c0a), z: read(0x5c0b)};
                const head = {x: read(0x5c20), y: read(0x5c2a), z: read(0x5c2b)};
                const headOverlayPosition = {x: read(0x5c29), y: read(0x5c2a), z: read(0x5c2b)};
                return {
                    player: {
                        body: Object.assign({}, body, {screenPosition: body}),
                        head: Object.assign({}, head, {
                            screenPosition: headOverlayPosition,
                            highResolutionPosition: toHighResolutionPosition(head),
                            semanticPosition: head,
                            renderPositionCandidate: headOverlayPosition,
                            overlayPosition: headOverlayPosition,
                            renderPositionSource: '0x5C29,0x5C2A,0x5C2B',
                        }),
                        orientation: {
                            label: 'unknown',
                            mirrored: read(0x5c0f) >= 0x4c,
                            mirrorMeaning: 'direction axis is selected by flag >= 0x4c',
                            directionAxisThreshold: 0x4c,
                            mirrorFlagsConsistent: read(0x5c0f) === read(0x5c2f),
                            spriteMirrorKey: [
                                formatByte(read(0x5c41)),
                                formatByte(read(0x5c45)),
                                formatByte(read(0x5c0f)),
                                formatByte(read(0x5c2f)),
                            ].join(':'),
                            visualFacing: null,
                            visualFacingSource: 'fallback parser does not classify sprite/mirror combinations',
                            bodyMirrorFlag: read(0x5c0f),
                            headMirrorFlag: read(0x5c2f),
                            headSprite: read(0x5c41),
                            bodySprite: read(0x5c45),
                            state: {
                                label: 'unclassified',
                                source: 'sprite table pending validation',
                            },
                        },
                    },
                    room: {
                        id: read(0x5c10),
                        colourAttribute: read(0x5bad),
                        color: read(0x5bad),
                        size: {
                            x: read(0x5bab),
                            y: read(0x5bac),
                            z: read(0x5bae),
                        },
                        staticCache: frame.knightLoreStaticMemory ? {
                            memoryStart: frame.knightLoreStaticMemory.memoryStart,
                            memoryEnd: frame.knightLoreStaticMemory.memoryEnd,
                            byteLength: frame.knightLoreStaticMemory.byteLength,
                            ranges: frame.knightLoreStaticMemory.ranges,
                        } : null,
                        sprites: [],
                    },
                    raw: {
                        selectedBytes: selectedByteSpecs
                            .map(([key, address]) => ({
                                key,
                                address,
                                value: read(address),
                            }))
                            .sort((a, b) => a.address - b.address),
                    },
                };
            }

            function getKnightLoreScene(frame) {
                return frame.knightLoreScene || fallbackKnightLoreScene(frame);
            }

            function inferOrientation(frame) {
                const orientation = getKnightLoreScene(frame).player.orientation;
                const mirrored = orientation.mirrored ? 'mirrored/rotated variant' : 'base variant';

                return [
                    mirrored,
                    'headSprite=' + formatByte(orientation.headSprite),
                    'bodySprite=' + formatByte(orientation.bodySprite),
                    'bodyMirror=' + formatByte(orientation.bodyMirrorFlag),
                    'headMirror=' + formatByte(orientation.headMirrorFlag),
                ].join(', ');
            }

            function updateDecodedTable(frame) {
                const scene = getKnightLoreScene(frame);
                const room = scene.room || {};
                const body = scene.player.body;
                const head = scene.player.head;
                const staticCache = room.staticCache || frame.knightLoreStaticMemory || null;
                const rows = [
                    ['Semantic frames', String(frame.semanticFrameCounter || 0)],
                    ['PC', '0x' + hex(frame.pc, 4)],
                    ['T-states', String(frame.tstates)],
                    ['Room id', formatByte(room.id)],
                    ['Room colour/attribute', formatByte(room.colourAttribute)],
                    ['Room size bytes XYZ', formatPosition(room.size)],
                    ['Static cache', staticCache ? String(staticCache.byteLength) + ' bytes' : 'not loaded'],
                    ['Body RAM position', formatPosition(body)],
                    ['Body screen position', formatPosition(body.screenPosition)],
                    ['Head RAM position', formatPosition(head)],
                    ['Head screen position', formatPosition(head.screenPosition)],
                    ['Head render candidate', formatPosition(head.renderPositionCandidate)],
                    ['Head full formula position', formatPosition(head.highResolutionPosition)],
                    ['Orientation components', inferOrientation(frame)],
                    ['Sprite/mirror key', scene.player.orientation.spriteMirrorKey || '--'],
                    ['Player state', scene.player.orientation.state ? scene.player.orientation.state.label : 'unclassified'],
                    ['Dynamic sprite records', String(scene.room.sprites.length)],
                    ['Registers', frame.registers.map(value => '0x' + hex(value, 4)).join(' ')],
                ];
                document.getElementById('semantic-decoded').innerHTML = rows.map(row => (
                    '<tr><th>' + row[0] + '</th><td class="mono">' + row[1] + '</td></tr>'
                )).join('');
            }

            function updateSelectedBytesTable(frame) {
                document.getElementById('semantic-selected-bytes').innerHTML = getKnightLoreScene(frame).raw.selectedBytes
                    .slice()
                    .sort((a, b) => a.address - b.address)
                    .map(item => {
                    return (
                        '<tr>' +
                        '<td class="mono">0x' + hex(item.address, 4) + '</td>' +
                        '<td>' + item.key + '</td>' +
                        '<td class="mono">' + formatByte(item.value) + '</td>' +
                        '<td class="mono">' + (item.value === null ? '--' : item.value) + '</td>' +
                        '</tr>'
                    );
                }).join('');
            }

            function updateRawDump(frame) {
                const rows = [];
                for (let address = 0x5c00; address <= 0x5c90; address += 16) {
                    const bytes = readSemanticBytes(frame, address, 16);
                    rows.push(
                        '<tr>' +
                        '<th class="mono">0x' + hex(address, 4) + '</th>' +
                        '<td class="mono">' + bytes.map(formatByte).join(' ') + '</td>' +
                        '</tr>'
                    );
                }
                document.getElementById('semantic-raw-dump').innerHTML = rows.join('');
            }

            function projectKnightLorePoint(point) {
                point = point && point.screenPosition ? point.screenPosition : point;
                if (
                    !point
                    || point.x === null
                    || point.y === null
                    || point.z === null
                ) {
                    return null;
                }

                const worldX = point.y;
                const worldY = point.x;

                return {
                    x: 160 + ((worldX + worldY) - 256) * 0.5 * HORIZONTAL_PLANE_SCALE,
                    y: 120 + (worldY - worldX) * 0.25 * HORIZONTAL_PLANE_SCALE - (point.z - 128) * 0.5,
                };
            }

            function setupValidationOverlay() {
                if (semanticValidationOverlay) return true;

                const canvas = document.querySelector('#jsspeccy canvas');
                if (!canvas || !canvas.parentElement) return false;

                const overlay = document.createElement('canvas');
                overlay.id = 'semantic-validation-overlay';
                overlay.width = 320;
                overlay.height = 240;
                overlay.style.position = 'absolute';
                overlay.style.left = canvas.offsetLeft + 'px';
                overlay.style.top = canvas.offsetTop + 'px';
                overlay.style.width = canvas.clientWidth + 'px';
                overlay.style.height = canvas.clientHeight + 'px';

                canvas.parentElement.appendChild(overlay);
                semanticValidationOverlay = overlay;
                semanticValidationCtx = overlay.getContext('2d');
                return true;
            }

            function drawCross(ctx, point, color, label) {
                if (!point) return;
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(point.x - 5, point.y);
                ctx.lineTo(point.x + 5, point.y);
                ctx.moveTo(point.x, point.y - 5);
                ctx.lineTo(point.x, point.y + 5);
                ctx.stroke();
                ctx.fillText(label, point.x + 7, point.y - 7);
            }

            function drawSpriteRecord(ctx, sprite) {
                const point = projectKnightLorePoint(sprite.screenPosition || sprite.position);
                if (!point) return;

                ctx.strokeStyle = 'rgba(255, 232, 80, 0.95)';
                ctx.fillStyle = 'rgba(255, 232, 80, 0.95)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(point.x, point.y - 5);
                ctx.lineTo(point.x + 5, point.y);
                ctx.lineTo(point.x, point.y + 5);
                ctx.lineTo(point.x - 5, point.y);
                ctx.closePath();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(point.x - 7, point.y);
                ctx.lineTo(point.x + 7, point.y);
                ctx.moveTo(point.x, point.y - 7);
                ctx.lineTo(point.x, point.y + 7);
                ctx.stroke();
                ctx.fillText(hex(sprite.spriteId, 2), point.x + 8, point.y - 8);
            }

            function candidateSummary(sprite) {
                return {
                    address: '0x' + hex(sprite.address, 4),
                    id: '0x' + hex(sprite.spriteId, 2),
                    position: (
                        [sprite.position.x, sprite.position.y, sprite.position.z].join(', ')
                        + ' -> '
                        + (sprite.screenPosition
                            ? [sprite.screenPosition.x, sprite.screenPosition.y, sprite.screenPosition.z].join(', ')
                            : '--')
                    ),
                    dimensions: [
                        sprite.dimensions.x,
                        sprite.dimensions.y,
                        sprite.dimensions.z,
                    ].join(', '),
                    raw: sprite.raw.map(value => hex(value, 2)).join(' '),
                };
            }

            function updateCandidatePanel(frame) {
                const scene = getKnightLoreScene(frame);
                const selectAllCheckbox = document.getElementById('candidate-select-all');
                document.getElementById('candidate-count').textContent = String(scene.room.sprites.length);
                selectedCandidateIndexes = new Set(
                    [...selectedCandidateIndexes].filter(index => index < scene.room.sprites.length)
                );

                if (candidateRowCount !== scene.room.sprites.length) {
                    document.getElementById('candidate-records').innerHTML = scene.room.sprites.map((sprite, index) => (
                        '<tr>' +
                        '<td><input type="checkbox" data-candidate-index="' + index + '"></td>' +
                        '<td class="mono" data-field="index"></td>' +
                        '<td class="mono" data-field="address"></td>' +
                        '<td class="mono" data-field="id"></td>' +
                        '<td class="mono" data-field="position"></td>' +
                        '<td class="mono" data-field="dimensions"></td>' +
                        '<td class="mono" data-field="raw"></td>' +
                        '</tr>'
                    )).join('');
                    candidateRowCount = scene.room.sprites.length;
                }

                const rows = document.getElementById('candidate-records').querySelectorAll('tr');
                scene.room.sprites.forEach((sprite, index) => {
                    const summary = candidateSummary(sprite);
                    const row = rows[index];
                    row.querySelector('input').checked = selectedCandidateIndexes.has(index);
                    row.querySelector('[data-field="index"]').textContent = index;
                    row.querySelector('[data-field="address"]').textContent = summary.address;
                    row.querySelector('[data-field="id"]').textContent = summary.id;
                    row.querySelector('[data-field="position"]').textContent = summary.position;
                    row.querySelector('[data-field="dimensions"]').textContent = summary.dimensions;
                    row.querySelector('[data-field="raw"]').textContent = summary.raw;
                });

                selectAllCheckbox.checked = (
                    scene.room.sprites.length > 0
                    && selectedCandidateIndexes.size === scene.room.sprites.length
                );
                selectAllCheckbox.indeterminate = (
                    selectedCandidateIndexes.size > 0
                    && selectedCandidateIndexes.size < scene.room.sprites.length
                );
            }

            function updateValidationOverlay(frame) {
                if (!setupValidationOverlay()) return;

                const scene = getKnightLoreScene(frame);
                const ctx = semanticValidationCtx;
                ctx.clearRect(0, 0, 320, 240);
                ctx.font = '10px Menlo, Consolas, monospace';
                ctx.textBaseline = 'top';

                if (showSelectedCandidateValidation) {
                    for (const index of selectedCandidateIndexes) {
                        const sprite = scene.room.sprites[index];
                        if (sprite) drawSpriteRecord(ctx, sprite);
                    }
                }

                const bodyPoint = projectKnightLorePoint(scene.player.body);
                const headPoint = projectKnightLorePoint(scene.player.head);
                if (headPoint) {
                    headPoint.y += HEAD_MARKER_Y_OFFSET;
                }
                if (showPlayerValidation && bodyPoint && headPoint) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.beginPath();
                    ctx.moveTo(bodyPoint.x, bodyPoint.y);
                    ctx.lineTo(headPoint.x, headPoint.y);
                    ctx.stroke();
                }
                if (showPlayerValidation) {
                    drawCross(ctx, bodyPoint, '#00ffff', 'body');
                    drawCross(ctx, headPoint, '#ff70f0', 'head');
                }
            }

            function updateDebugPanels(frame) {
                updateDecodedTable(frame);
                updateSelectedBytesTable(frame);
                updateRawDump(frame);
                updateCandidatePanel(frame);
            }

            function startEmulator() {
                let loggedSemanticFrame = false;
                let lastDebugPanelUpdateTime = 0;
                let lastOverlayUpdateTime = 0;
                let latestCandidateCount = 0;
                document.getElementById('show-player-validation').addEventListener('change', event => {
                    showPlayerValidation = event.target.checked;
                    if (latestSemanticFrame) updateValidationOverlay(latestSemanticFrame);
                });
                document.getElementById('show-candidate-validation').addEventListener('change', event => {
                    showSelectedCandidateValidation = event.target.checked;
                    if (latestSemanticFrame) updateValidationOverlay(latestSemanticFrame);
                });
                document.getElementById('candidate-select-all').addEventListener('change', event => {
                    selectedCandidateIndexes = new Set();
                    if (event.target.checked) {
                        for (let i = 0; i < latestCandidateCount; i++) {
                            selectedCandidateIndexes.add(i);
                        }
                    }
                    if (latestSemanticFrame) {
                        updateCandidatePanel(latestSemanticFrame);
                        updateValidationOverlay(latestSemanticFrame);
                    }
                });
                document.getElementById('candidate-records').addEventListener('change', event => {
                    const index = event.target.dataset.candidateIndex;
                    if (index === undefined) return;
                    const numericIndex = parseInt(index, 10);
                    if (event.target.checked) {
                        selectedCandidateIndexes.add(numericIndex);
                    } else {
                        selectedCandidateIndexes.delete(numericIndex);
                    }
                    if (latestSemanticFrame) {
                        updateCandidatePanel(latestSemanticFrame);
                        updateValidationOverlay(latestSemanticFrame);
                    }
                });
                emu = JSSpeccy(document.getElementById('jsspeccy'), {
                    zoom: 2,
                    sandbox: false,
                    openUrl: 'Knight Lore (1984)(Ultimate).z80',
                    pokes: KNIGHT_LORE_ACTIVE_POKES,
                    pokeAddressBase: KNIGHT_LORE_POKE_ADDRESS_BASE,
                    knightLoreStage0Container: document.getElementById('knight-lore-stage0'),
                    knightLoreStage0DiagnosticsContainer: document.getElementById('knight-lore-stage2-diagnostics'),
                    onPokesApplied: payload => {
                        console.table(payload.results.map(result => ({
                            reason: payload.reason,
                            label: result.label,
                            source: result.sourceAddress === null
                                ? '--'
                                : '0x' + hex(result.sourceAddress, 4),
                            base: result.addressBase === null
                                ? '--'
                                : '0x' + hex(result.addressBase, 4),
                            address: result.address === null
                                ? '--'
                                : '0x' + hex(result.address, 4),
                            value: result.value === null
                                ? '--'
                                : '0x' + hex(result.value, 2),
                            before: result.before === undefined
                                ? '--'
                                : '0x' + hex(result.before, 2),
                            after: result.after === undefined
                                ? '--'
                                : '0x' + hex(result.after, 2),
                            readback: result.readbackMatches,
                        })));
                    },
                    onSemanticFrame: frame => {
                        semanticFrameCounter += 1;
                        frame.semanticFrameCounter = semanticFrameCounter;
                        if (!loggedSemanticFrame) {
                            console.log(frame.pc, frame.semanticMemory[0], frame);
                            loggedSemanticFrame = true;
                        }
                        latestSemanticFrame = frame;
                        latestCandidateCount = getKnightLoreScene(frame).room.sprites.length;
                        const now = performance.now();
                        if (now - lastOverlayUpdateTime > 100) {
                            updateValidationOverlay(frame);
                            lastOverlayUpdateTime = now;
                        }
                        if (now - lastDebugPanelUpdateTime > 500) {
                            updateDebugPanels(frame);
                            lastDebugPanelUpdateTime = now;
                        }
                    },
                });
                window.knightLoreWorkbench = {
                    get emulator() {
                        return emu;
                    },
                    pokePresets: KNIGHT_LORE_POKE_PRESETS,
                    activePokes: KNIGHT_LORE_ACTIVE_POKES,
                    pokeAddressBase: KNIGHT_LORE_POKE_ADDRESS_BASE,
                    inventorySlot1Address: KNIGHT_LORE_INVENTORY_SLOT_1_ADDRESS,
                    applyPokes: pokes => emu.applyPokes(pokes),
                    setInventorySlot1: value => emu.applyPokes([{
                        address: KNIGHT_LORE_INVENTORY_SLOT_1_ADDRESS,
                        value,
                        label: 'inventory slot 1 item code',
                    }]),
                };
                bindInventoryPokeControl();
            }
        </script>
    </head>
    <body class="hide-deferred-debug stage0-three" onload="startEmulator()">
        <div id="validation-workbench">
            <div id="emulator-column">
                <div id="jsspeccy"></div>
                <form id="inventory-poke-panel">
                    <label for="inventory-item-code">Inventory 1</label>
                    <input id="inventory-item-code" type="text" inputmode="text" autocomplete="off" placeholder="0x00">
                    <button id="send-inventory-item-code" type="submit">Send</button>
                    <span id="inventory-poke-status">Address 23516</span>
                </form>
            </div>
            <div id="knight-lore-stage0"></div>
            <div id="candidate-panel">
                <h2>Candidate Dynamic Records</h2>
                <label>
                    <input id="show-player-validation" type="checkbox">
                    Player markers
                </label>
                <label>
                    <input id="show-candidate-validation" type="checkbox" checked>
                    Checked records
                </label>
                <label>
                    <input id="candidate-select-all" type="checkbox">
                    All / none
                </label>
                <p>
                    Candidate count: <span id="candidate-count" class="mono">0</span>
                </p>
                <table>
                    <thead>
                        <tr>
                            <th>Draw</th>
                            <th>#</th>
                            <th>Address</th>
                            <th>Sprite</th>
                            <th>Position XYZ</th>
                            <th>Dim XYZ</th>
                            <th>Raw</th>
                        </tr>
                    </thead>
                    <tbody id="candidate-records"></tbody>
                </table>
            </div>
        </div>
        <div id="semantic-debug">
            <h2>Knight Lore Semantic Debug</h2>
            <h3>Decoded Player State</h3>
            <table>
                <tbody id="semantic-decoded">
                    <tr><td>Waiting for semantic frame...</td></tr>
                </tbody>
            </table>
            <div id="selected-bytes-section">
                <h3>Selected Raw Bytes</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Address</th>
                            <th>Meaning</th>
                            <th>Hex</th>
                            <th>Decimal</th>
                        </tr>
                    </thead>
                    <tbody id="semantic-selected-bytes"></tbody>
                </table>
            </div>
            <div id="raw-memory-section">
                <h3>Raw Work Memory Dump</h3>
                <table>
                    <tbody id="semantic-raw-dump"></tbody>
                </table>
            </div>
            <h3>Stage 2 Room Diagnostics</h3>
            <div id="knight-lore-stage2-diagnostics"></div>
        </div>
    </body>
</html>
